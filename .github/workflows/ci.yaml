# Agent Workflow: CI Pipeline
# Runs on every push and PR to verify code quality.

name: CI

on:
  push:
    branches-ignore:
      - "master"
  pull_request:
    branches: ["develop", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  BUN_VERSION: "1"
  RUST_VERSION: "1.85"
  PYTHON_VERSION: "3.12"
  FLUTTER_VERSION: "3.29"
  SENTRUX_VERSION: "latest"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f "Cargo.toml" ]; then
            echo "type=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "pubspec.yaml" ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
          elif [ -f "pyproject.toml" ]; then
            echo "type=python" >> "$GITHUB_OUTPUT"
          elif [ -f "*.xcodeproj" ]; then
            echo "type=swift" >> "$GITHUB_OUTPUT"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.detect.outputs.type == 'node'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        if: steps.detect.outputs.type == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Python
        if: steps.detect.outputs.type == 'python'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies (Node)
        if: steps.detect.outputs.type == 'node'
        run: bun install --frozen-lockfile

      - name: Install dependencies (Python)
        if: steps.detect.outputs.type == 'python'
        run: uv sync --locked

      - name: Lint (Node)
        if: steps.detect.outputs.type == 'node'
        run: |
          if grep -q '"lint"' package.json 2>/dev/null; then
            bun run lint
          fi
          if grep -q '"format:check"' package.json 2>/dev/null; then
            bun run format:check
          fi

      - name: Lint (Rust)
        if: steps.detect.outputs.type == 'rust'
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Analyze (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        run: flutter analyze

      - name: Lint (Python)
        if: steps.detect.outputs.type == 'python'
        run: |
          uv run ruff check .
          uv run ruff format --check .

  types:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          if [ -f "tsconfig.json" ]; then echo "type=ts" >> "$GITHUB_OUTPUT"
          elif [ -f "Cargo.toml" ]; then echo "type=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "pubspec.yaml" ]; then echo "type=flutter" >> "$GITHUB_OUTPUT"
          elif [ -f "pyproject.toml" ]; then echo "type=py" >> "$GITHUB_OUTPUT"
          else echo "type=unknown" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Bun
        if: steps.detect.outputs.type == 'ts'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        if: steps.detect.outputs.type == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Python
        if: steps.detect.outputs.type == 'py'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (Node)
        if: steps.detect.outputs.type == 'ts'
        run: bun install --frozen-lockfile

      - name: Install (Python)
        if: steps.detect.outputs.type == 'py'
        run: uv sync --locked

      - name: Type check (TS)
        if: steps.detect.outputs.type == 'ts'
        run: |
          if grep -q '"type-check"' package.json 2>/dev/null; then
            bun run type-check
          else
            bun run tsc --noEmit
          fi

      - name: Type check (Rust)
        if: steps.detect.outputs.type == 'rust'
        run: cargo check

      - name: Type check (Python)
        if: steps.detect.outputs.type == 'py'
        run: uv run mypy . || echo "mypy not configured"

  ui-test:
    name: UI Structure Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pytest pyyaml 2>/dev/null || true

      - name: Run UI structure tests
        run: |
          if [ -f "tests/test_ui_structure.py" ]; then
            python3 -m pytest tests/test_ui_structure.py -v --tb=short
          else
            echo "No UI structure tests found — skipping"
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect
        id: detect
        run: |
          if [ -f "package.json" ]; then echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f "Cargo.toml" ]; then echo "type=rust" >> "$GITHUB_OUTPUT"
          elif [ -f "pubspec.yaml" ]; then echo "type=flutter" >> "$GITHUB_OUTPUT"
          elif [ -f "pyproject.toml" ]; then echo "type=python" >> "$GITHUB_OUTPUT"
          else echo "type=unknown" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Bun
        if: steps.detect.outputs.type == 'node'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        if: steps.detect.outputs.type == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Python
        if: steps.detect.outputs.type == 'python'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (Node)
        if: steps.detect.outputs.type == 'node'
        run: bun install --frozen-lockfile

      - name: Install (Python)
        if: steps.detect.outputs.type == 'python'
        run: uv sync --locked

      - name: Run tests (Node)
        if: steps.detect.outputs.type == 'node'
        run: bun run test

      - name: Run tests (Rust)
        if: steps.detect.outputs.type == 'rust'
        run: cargo test

      - name: Run tests (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        run: flutter test

      - name: Run tests (Python)
        if: steps.detect.outputs.type == 'python'
        run: uv run pytest

  secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      - name: Gitleaks fallback (direct)
        if: failure()
        continue-on-error: true
        run: |
          docker run --rm -v "$(pwd):/repo" \
            ghcr.io/gitleaks/gitleaks detect \
            --source /repo -v --report-format json --report-path /tmp/gitleaks.json

  sentrux:
    name: Sentrux Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sentrux
        run: |
          curl -fsSL https://raw.githubusercontent.com/sentrux/sentrux/main/install.sh | sh
          echo "$HOME/.sentrux/bin" >> "$GITHUB_PATH"

      - name: Run quality gate
        run: |
          if [ -f ".sentrux/rules.toml" ]; then
            sentrux check . || echo "Sentrux check failed (non-blocking in CI)"
          else
            echo "No .sentrux/rules.toml found — skipping"
          fi

      - name: Gate comparison (if baseline exists)
        run: |
          if [ -f ".sentrux/baseline.json" ]; then
            sentrux gate . || echo "Quality degraded from baseline"
          fi

  graphify:
    name: Graphify Knowledge Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Graphify
        run: |
          if [ -d "$HOME/projects/graphify" ]; then
            uv sync --directory "$HOME/projects/graphify"
          fi

      - name: Scan knowledge graph
        run: |
          if [ -d "$HOME/projects/graphify" ]; then
            uv run --directory "$HOME/projects/graphify" graphify scan . --quiet
          else
            echo "Graphify not available — skipping"
          fi

  agent-attribution:
    name: Agent Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch naming
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          if echo "$BRANCH" | grep -qE "^(master|main|develop)$"; then
            echo "Protected branch: $BRANCH — skipping validation"
            exit 0
          fi
          if ! echo "$BRANCH" | grep -qE "^(feature|fix|refactor|chore|docs|test|hotfix)/[a-z0-9._-]+/.+"; then
            echo "::error::Invalid branch name: $BRANCH"
            echo "::error::Format: {type}/{agent}/{description}"
            echo "::error::Example: feature/opencode/user-auth"
            exit 1
          fi
          AGENT=$(echo "$BRANCH" | awk -F/ '{print $2}')
          echo "Agent: $AGENT"
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
