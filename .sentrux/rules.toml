# Sentrux Quality Rules — Muxy
# Architectural governance enforced by pre-push hook and CI.

[constraints]
min_quality_score = 6000
max_cycles = 0
max_coupling = "B"
max_cc = 25
max_god_file_percent = 20
no_god_files = true

[[layers]]
name = "foundation"
paths = ["GhosttyKit/*", "MuxyShared/*"]
order = 0

[[layers]]
name = "server"
paths = ["MuxyServer/*"]
order = 1

[[layers]]
name = "app"
paths = ["Muxy/**/*.swift"]
order = 2

[[layers]]
name = "tests"
paths = ["Tests/**/*.swift"]
order = 3

[[boundaries]]
from = "MuxyServer/*"
to = "Muxy/*"
reason = "Server must not depend on the app"

[[boundaries]]
from = "MuxyShared/*"
to = "Muxy/*"
reason = "Shared library must not depend on the app"

[[boundaries]]
from = "MuxyShared/*"
to = "MuxyServer/*"
reason = "Shared library must not depend on the server"

[[boundaries]]
from = "GhosttyKit/*"
to = "Muxy/*"
reason = "Ghostty C wrapper must not depend on Swift app"

[[boundaries]]
from = "GhosttyKit/*"
to = "MuxyShared/*"
reason = "Ghostty C wrapper must not depend on Swift shared lib"

[metrics]
# Customize metric weights (must sum to 100)
weight_modularity = 30
weight_acyclicity = 25
weight_depth = 20
weight_equality = 15
weight_redundancy = 10

[ci]
fail_on_degradation = true
baseline_required = true
