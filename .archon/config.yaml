assistant: pi
assistants:
  pi:
    model: deepseek/deepseek-chat

defaults:
  loadDefaultCommands: true
  loadDefaultWorkflows: true

quality:
  sentrux:
    enabled: true
    failOnDegrade: true

git:
  branchFormat: "{type}/{agent}/{description}"
  types:
    - feature
    - fix
    - refactor
    - chore
    - docs
    - test
    - hotfix
  agents:
    - opencode
    - claude-code
    - hermes
    - pi
  baseBranch: main
  releaseBranch: master
