# Agent Workflow: Doppler Secrets Integration
# Secrets managed via Doppler (project: novaops-vps, config: prd)
#
# Setup:
#   doppler setup   # Select project + config
#   doppler secrets download --no-file --format env > .env.local
#
# Hooks auto-detect doppler and inject secrets for CI/test runs.

setup:
  project: "novaops-vps"
  config: "prd"

secrets:
  # Mount these env vars during CI and pre-push hooks
  inject:
    - DOPPLER_TOKEN
    - GITHUB_TOKEN
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
